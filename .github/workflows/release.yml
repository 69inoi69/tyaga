# Making a release: Actions → Release → Run workflow → enter a version, e.g. v1.0.0.
# Builds TYAGA for Windows, macOS and Linux and puts the archives on the Releases page.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Icon and version for the Windows exe
        env:
          VERSION: ${{ inputs.version }}
        run: |
          command -v llvm-windres || ls /usr/bin/llvm-windres-* || (sudo apt-get update -qq && sudo apt-get install -y -qq llvm)
          winres/make.sh "$VERSION"

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The version must look like v1.0.0"; exit 1
          fi
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            label=$os; [ "$os" = darwin ] && label=macos # Go calls macOS "darwin"; people don't
            name="tyaga-$VERSION-$label-$arch"
            exe=tyaga; [ "$os" = windows ] && exe=tyaga.exe
            gui=""; [ "$os" = windows ] && gui="-H=windowsgui" # no console window on Windows
            mkdir -p "build/$name/tyaga"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w $gui -X main.version=$VERSION" -o "build/$name/tyaga/$exe" .
            if [ "$os" = windows ]; then
              (cd "build/$name" && zip -qr "../../dist/$name.zip" tyaga)
            else
              tar -C "build/$name" -czf "dist/$name.tar.gz" tyaga
            fi
          done
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "TYAGA $VERSION" --generate-notes
